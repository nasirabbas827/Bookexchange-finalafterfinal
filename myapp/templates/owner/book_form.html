{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4">{{ action }} Book</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" required value="{{ book.title|default_if_none:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Author</label>
                <input type="text" name="author" class="form-control" required value="{{ book.author|default_if_none:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Genre</label>
                <input type="text" name="genre" class="form-control" required value="{{ book.genre|default_if_none:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Condition</label>
                <select name="condition" class="form-select" required>
                    <option value="New" {% if book.condition == "New" %}selected{% endif %}>New</option>
                    <option value="Good" {% if book.condition == "Good" %}selected{% endif %}>Good</option>
                    <option value="Fair" {% if book.condition == "Fair" %}selected{% endif %}>Fair</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" required value="{{ book.location|default_if_none:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select" required>
                    <option value="Available" {% if book.status == "Available" %}selected{% endif %}>Available</option>
                    <option value="Reserved" {% if book.status == "Reserved" %}selected{% endif %}>Reserved</option>
                    <option value="Not Available" {% if book.status == "Not Available" %}selected{% endif %}>Not Available</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Photo</label><br>
                {% if book.photo_url %}
                    <img src="{{ book.photo_url.url }}" alt="Book Photo" class="img-thumbnail mb-2" style="max-width: 150px;">
                {% endif %}
                <input type="file" name="photo_url" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">External URL</label>
                <input type="url" name="external_url" class="form-control" value="{{ book.external_url|default_if_none:'' }}">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">{{ action }} Book</button>
            </div>
        </form>

        <div class="mt-3">
            <a href="{% url 'book_list' %}" class="btn btn-secondary">Back to Book List</a>
        </div>
    </div>
</div>

{% endblock %}
