{% extends 'base.html' %}
{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to remove <strong>{{ wishlist_item.title }}</strong> from your wishlist?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'wishlist_view' %}">Cancel</a>
</form>
{% endblock %}
